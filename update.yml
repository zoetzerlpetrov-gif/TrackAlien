name: Actualizar datos UAP

# ────────────────────────────────────────────────────────────────
# Corre a las 06:00 y 18:00 hora de México (UTC-6 todo el año)
# En UTC eso es 12:00 y 00:00.
# También se puede lanzar manualmente desde la pestaña "Actions".
# ────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Clonar el repositorio completo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Python 3.11
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. No hay dependencias externas — solo stdlib
      #    (urllib, json, csv, xml.etree, datetime…)
      #    Si en el futuro añades requests o beautifulsoup4, descomenta:
      # - name: Instalar dependencias
      #   run: pip install requests beautifulsoup4

      # 4. Ejecutar el extractor
      - name: Extraer datos UAP
        run: python scripts/fetch_data.py

      # 5. Si hubo cambios en /data, commitear y pushear
      - name: Commitear datos actualizados
        run: |
          git config user.name  "uap-bot[github-actions]"
          git config user.email "uap-bot@users.noreply.github.com"
          git add data/
          # Si no hay cambios, git commit falla silenciosamente
          git diff --cached --quiet || git commit -m "chore: actualizar datos UAP [$(date -u +%Y-%m-%dT%H:%M)Z]"
          git push
