name: Actualizar datos UAP

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extraer datos UAP
        run: python scripts/fetch_data.py

      - name: Commitear datos actualizados
        run: |
          git config user.name  "uap-bot[github-actions]"
          git config user.email "uap-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: actualizar datos UAP [$(date -u +%Y-%m-%dT%H:%M)Z]"
          git push
